# Experiment - Speed Threshold Analysis
# Test different max speeds vs throughput
# Usage: python run.py configs/experiment_speed_threshold.yaml

simulation:
  duration: 1800.0  # 30 minutes
  dt: 0.1
  seed: 42
  stats_interval: 60.0

mode: grid

grid:
  grid_size: 5
  lane_length: 100.0

spawning:
  mode: uniform
  spawn_rate: 1.0
  variation: 0.5

signals:
  control_mode: adaptive
  min_green: 15.0
  max_green: 60.0
  yellow_time: 3.0
  all_red_time: 2.0

physics:
  v_max: 13.89  # 50 kmph (will be varied in experiment)
  a_max: 2.0
  b_comfort: 3.0
  delta: 4.0
  s0: 2.0
  T: 1.5

output:
  output_dir: results/experiment_speed_threshold
  live_export: false

# Note: This config is for single run
# Use parameter_sweep.py for full speed threshold experiment
