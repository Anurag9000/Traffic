# Grid Network - Subgrid Configuration
# Different signal timings for different regions
# Usage: python run.py configs/grid_subgrid.yaml

simulation:
  duration: 3600.0
  dt: 0.1
  seed: 42
  stats_interval: 60.0

mode: grid

grid:
  grid_size: 7
  lane_length: 100.0
  subgrid_regions:
    - bounds: [0, 0, 3, 3]  # Downtown - adaptive, longer greens
      control_mode: adaptive
      min_green: 20.0
      max_green: 80.0
    - bounds: [4, 4, 7, 7]  # Suburban - fixed, shorter cycle
      control_mode: fixed
      cycle_time: 90.0

spawning:
  mode: uniform
  spawn_rate: 1.2
  variation: 0.5

signals:
  control_mode: fixed  # Default for non-subgrid intersections
  cycle_time: 120.0
  yellow_time: 3.0
  all_red_time: 2.0

output:
  output_dir: results/grid_subgrid
  live_export: false
