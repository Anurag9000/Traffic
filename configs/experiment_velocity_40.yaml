# Experiment - Velocity Invariance (40 kmph)
# Compare with 30 kmph version
# Usage: python run.py configs/experiment_velocity_40.yaml

simulation:
  duration: 1800.0
  dt: 0.1
  seed: 42
  stats_interval: 60.0

mode: grid

grid:
  grid_size: 5
  lane_length: 100.0

spawning:
  mode: uniform
  spawn_rate: 1.0
  variation: 0.5

signals:
  control_mode: adaptive
  min_green: 15.0
  max_green: 60.0
  yellow_time: 3.0
  all_red_time: 2.0

physics:
  v_max: 11.11  # 40 kmph
  a_max: 2.0
  b_comfort: 3.0
  delta: 4.0
  s0: 2.0
  T: 1.5

output:
  output_dir: results/experiment_velocity_40
  live_export: false
