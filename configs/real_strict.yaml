mode: real

simulation:
  duration: 3600.0
  dt: 0.1
  stats_interval: 60.0
  seed: 42

spawning:
  mode: uniform
  spawn_rate: 0.8
  variation: 0.3

real_map:
  graphml_path: delhi_cp.graphml
  map_filter: backbone
  # STRICT MODE: Enforce everything
  enforce_speed_limit: true
  enforce_lanes: true
  enforce_oneway: true

signals:
  control_mode: adaptive

output:
  output_dir: results_strict
  live_export: false
